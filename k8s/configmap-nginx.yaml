# Proxy TLS del frontend: redirige HTTP -> HTTPS y termina TLS.
# El contenedor Next.js sigue escuchando en 127.0.0.1:3000 (mismo pod).
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx
data:
  default.conf: |
    server {
      listen 80;
      server_name _;

      # Redirección permanente: toda petición HTTP va a HTTPS.
      return 301 https://$host:30443$request_uri;
    }

    server {
      listen 443 ssl;
      server_name _;

      ssl_certificate     /etc/nginx/tls/tls.crt;
      ssl_certificate_key /etc/nginx/tls/tls.key;
      ssl_protocols       TLSv1.2 TLSv1.3;

      location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
      }
    }
