# Acceso local a la UI: HTTP (30000) y HTTPS (30443).
# El proxy TLS redirige automáticamente HTTP -> HTTPS.
apiVersion: v1
kind: Service
metadata:
  name: frontend-ui
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30000
    - name: https
      port: 443
      targetPort: 443
      nodePort: 30443
